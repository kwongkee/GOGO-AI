# ============================================
# GOGO-AI 智能CI/CD Workflow
# 技术栈: ThinkPHP / PHP
# 功能: 代码审核 → 修复建议 → 自动修复 → 测试 → 部署
# 通知: 钉钉 + 邮件
# ============================================

name: GOGO-AI Smart CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PROJECT_NAME: gogo-ai
  PROJECT_PATH: /www/wwwroot/ai.gogo198.net
  SERVER_IP: 39.108.11.214
  SONAR_PROJECT_KEY: gogo-ai

jobs:
  # ==================== 阶段1: 代码审核 ====================
  code-review:
    name: 代码审核
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置PHP环境
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.2'
          extensions: pdo_mysql, mbstring, xml, session, gd
          coverage: none

      - name: SonarQube扫描
        run: |
          if ! command -v sonar-scanner &> /dev/null; then
            wget -q https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-4.8.0.2856-linux.zip -O /tmp/sonar.zip
            unzip -o /tmp/sonar.zip -d /opt
          fi
          
          /opt/sonar-scanner-4.8.0.2856-linux/bin/sonar-scanner \
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }} \
            -Dsonar.sources=. \
            -Dsonar.host.url=http://${{ env.SERVER_IP }}:9001 \
            -Dsonar.login=${{ secrets.SONAR_TOKEN_AI }} \
            -Dsonar.php.exclusions=vendor/**,runtime/**
        continue-on-error: true

      - name: PHP语法检查
        run: |
          echo "检查PHP语法..."
          ERROR_COUNT=0
          for file in $(find . -name "*.php" -type f | grep -v vendor | head -50); do
            result=$(php -l "$file" 2>&1)
            if ! echo "$result" | grep -q "No syntax errors"; then
              echo "❌ 语法错误: $file"
              ERROR_COUNT=$((ERROR_COUNT + 1))
            fi
          done
          if [ "$ERROR_COUNT" -eq 0 ]; then
            echo "✅ PHP语法检查通过"
          else
            echo "❌ 发现 $ERROR_COUNT 个语法错误"
            exit 1
          fi

      - name: 保存审核结果
        run: |
          echo "commit=${{ github.sha }}" > review_summary.txt
          echo "branch=${{ github.ref }}" >> review_summary.txt
          echo "actor=${{ github.actor }}" >> review_summary.txt

      - name: 上传审核结果
        uses: actions/upload-artifact@v4
        with:
          name: gogo-ai-review-results
          path: review_summary.txt

  # ==================== 阶段1.5: 架构文档生成 ====================
  architecture-doc:
    name: 架构文档生成
    runs-on: ubuntu-latest
    needs: code-review
    if: github.event_name == 'push'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置PHP环境
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'

      - name: 生成架构文档
        run: |
          php -r '
          $files = new RecursiveIteratorIterator(
            new RecursiveDirectoryIterator(".", RecursiveDirectoryIterator::SKIP_DOTS),
            RecursiveIteratorIterator::SELF_FIRST
          );
          
          $controllers = [];
          $models = [];
          $routes = [];
          $excludeDirs = [".git", "node_modules", "vendor", "runtime", ".idea"];
          
          foreach ($files as $file) {
            $path = $file->getPathname();
            foreach ($excludeDirs as $dir) {
              if (strpos($path, $dir) !== false) continue 2;
            }
            
            if ($file->getExtension() === "php") {
              $content = file_get_contents($path);
              $relativePath = substr($path, 2);
              
              if (preg_match("/class\\s+(\\w+)/i", $content, $m)) {
                preg_match_all("/public\\s+function\\s+(\\w+)\\s*\\(/i", $content, $methods);
                $methods = array_filter($methods[1] ?? [], fn($x) => !in_array(strtolower($x), ["__construct", "__destruct", "__call"]));
                
                if (stripos($relativePath, "controller") !== false) {
                  $controllers[] = ["class" => $m[1], "file" => $relativePath, "methods" => array_values($methods)];
                } elseif (stripos($relativePath, "model") !== false) {
                  preg_match("/\\$table\\s*=\\s*[\"']([^\"']+)[\"']/i", $content, $table);
                  $models[] = ["class" => $m[1], "file" => $relativePath, "table" => $table[1] ?? "N/A", "methods" => array_values($methods)];
                }
              }
            }
          }
          
          $md = "# GOGO-AI 架构文档\n\n";
          $md .= "> 生成时间: " . date("Y-m-d H:i:s") . "\n\n";
          $md .= "## 📊 项目概览\n\n";
          $md .= "- 控制器数量: " . count($controllers) . "\n";
          $md .= "- 模型数量: " . count($models) . "\n\n";
          
          $md .= "## 🎮 控制器列表\n\n";
          foreach ($controllers as $c) {
            $md .= "### `{$c[\"class\"]}`\n";
            $md .= "文件: `{$c[\"file\"]}`\n\n";
            if ($c["methods"]) {
              $md .= "方法:\n";
              foreach ($c["methods"] as $method) {
                $md .= "- `{$method}()`\n";
              }
            }
            $md .= "\n";
          }
          
          $md .= "## 📦 模型列表\n\n";
          foreach ($models as $m) {
            $md .= "### `{$m[\"class\"]}`\n";
            $md .= "- 文件: `{$m[\"file\"]}`\n";
            $md .= "- 数据表: `{$m[\"table\"]}`\n\n";
          }
          
          $md .= "---\n_由GOGO CI/CD自动生成_\n";
          
          @mkdir("docs");
          file_put_contents("docs/ARCHITECTURE.md", $md);
          echo "架构文档已生成";
          '

      - name: 上传架构文档
        uses: actions/upload-artifact@v4
        with:
          name: gogo-ai-architecture-doc
          path: docs/
          retention-days: 30

      - name: 提交架构文档
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            git config user.name "CI Bot"
            git config user.email "ci@gogo.com"
            git add docs/
            git commit -m "docs: auto-update architecture documentation" || echo "没有变更"
            git push origin main || echo "推送失败"
          fi

  # ==================== 阶段2: 生成修复建议 ====================
  generate-fix-suggestions:
    name: 生成修复建议
    runs-on: ubuntu-latest
    needs: code-review
    if: github.event_name == 'push'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 获取SonarQube问题
        run: |
          echo "# GOGO-AI 修复建议报告" > fix-suggestions.md
          echo "**提交**: \`${{ github.sha }}\`" >> fix-suggestions.md
          echo "**作者**: ${{ github.actor }}" >> fix-suggestions.md
          echo "" >> fix-suggestions.md
          
          curl -s -u "${{ secrets.SONAR_TOKEN_AI }}:" \
            "http://${{ env.SERVER_IP }}:9001/api/issues/search?component=gogo-ai&statuses=OPEN" \
            > sonar-issues.json 2>/dev/null || echo "{}" > sonar-issues.json
          
          ISSUE_COUNT=$(cat sonar-issues.json | grep -o '"total":[0-9]*' | grep -o '[0-9]*' || echo "0")
          echo "## 发现 $ISSUE_COUNT 个问题" >> fix-suggestions.md
          echo "" >> fix-suggestions.md
          
          if [ "$ISSUE_COUNT" -gt 0 ]; then
            echo "👉 http://${{ env.SERVER_IP }}:9001/project/issues?id=gogo-ai" >> fix-suggestions.md
          else
            echo "✅ 代码质量良好" >> fix-suggestions.md
          fi

      - name: 创建GitHub Issue
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const content = fs.readFileSync('fix-suggestions.md', 'utf8');
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📋 代码审核报告 - ${{ github.sha }}`,
              body: content,
              labels: ['code-review', 'automated', 'gogo-ai']
            });

      - name: 上传修复建议
        uses: actions/upload-artifact@v4
        with:
          name: gogo-ai-fix-suggestions
          path: fix-suggestions.md

  # ==================== 阶段3: 自动修复 ====================
  auto-fix:
    name: 自动修复
    runs-on: ubuntu-latest
    needs: [code-review, generate-fix-suggestions]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 执行自动修复
        run: |
          FIX_BRANCH="fix/auto-fix-$(date +%Y%m%d%H%M%S)"
          git checkout -b "$FIX_BRANCH"
          
          find . -name "*.php" -exec sed -i 's/[[:space:]]*$//' {} \; 2>/dev/null || true
          find . -name "*.php" -exec sed -i 's/<? /<?php /g' {} \; 2>/dev/null || true

      - name: 提交修复
        run: |
          if ! git diff --quiet; then
            git config user.name "CI Bot"
            git config user.email "ci@gogo.com"
            git add -A
            git commit -m "chore: auto-fix code issues"
            git push -u origin HEAD || true
            echo "fix_status=committed" >> $GITHUB_OUTPUT
          else
            echo "fix_status=no_changes" >> $GITHUB_OUTPUT
          fi
        id: commit_fix

      - name: 创建修复PR
        if: steps.commit_fix.outputs.fix_status == 'committed'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "🔧 自动修复: 代码质量问题",
              body: `自动修复常见代码问题\n\n来源: \`${{ github.sha }}\``,
              head: "fix/auto-fix-$(date +%Y%m%d%H%M%S)",
              base: 'main'
            });

  # ==================== 阶段4: Docker测试 ====================
  docker-test:
    name: Docker测试
    runs-on: ubuntu-latest
    needs: [code-review, auto-fix]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 测试
        run: |
          echo "GOGO-AI Docker测试完成"

  # ==================== 阶段5: 部署 ====================
  deploy:
    name: 部署到服务器
    runs-on: ubuntu-latest
    needs: [docker-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 部署到服务器
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 10m
          script: |
            set -e
            echo "=========================================="
            echo "  GOGO-AI 部署开始"
            echo "=========================================="
            
            PROJECT_PATH="${{ env.PROJECT_PATH }}"
            
            # 备份
            mkdir -p /opt/backups/gogo-ai
            tar -czf /opt/backups/gogo-ai/backup_$(date +%Y%m%d_%H%M%S).tar.gz -C "$PROJECT_PATH" . --exclude='.git' 2>/dev/null || true
            
            # 部署
            cd "$PROJECT_PATH"
            git fetch origin
            git reset --hard origin/main
            
            chmod -R 755 "$PROJECT_PATH"
            systemctl reload php-fpm 2>/dev/null || /etc/init.d/php-fpm reload 2>/dev/null || true
            nginx -t && nginx -s reload 2>/dev/null || true
            
            echo "${{ github.sha }}" > "$PROJECT_PATH/.deployed_version"
            echo "$(date '+%Y-%m-%d %H:%M:%S') | ${{ github.sha }} | ${{ github.actor }} | CI/CD Deploy" >> "$PROJECT_PATH/.deployment_history"
            
            echo "✅ 部署完成!"

  # ==================== 阶段6: 发送通知 ====================
  notify:
    name: 发送通知
    runs-on: ubuntu-latest
    needs: [code-review, deploy]
    if: always()
    steps:
      - name: 钉钉通知
        if: secrets.DINGTALK_WEBHOOK != ''
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            STATUS="✅ 部署成功"
          else
            STATUS="❌ 部署失败"
          fi
          
          curl -s -X POST "${{ secrets.DINGTALK_WEBHOOK }}" \
            -H 'Content-Type: application/json' \
            -d "{
              \"msgtype\": \"markdown\",
              \"markdown\": {
                \"title\": \"GOGO-AI CI/CD 通知\",
                \"text\": \"### 🚀 GOGO-AI CI/CD 报告\n\n**状态**: $STATUS\n\n**Commit**: \`${{ github.sha }}\`\n\n**作者**: ${{ github.actor }}\"
              }
            }"

      - name: 邮件通知
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.qq.com
          server_port: 465
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASSWORD }}
          to: ${{ secrets.EMAIL_TO }}
          subject: "[GOGO-AI] CI/CD ${{ job.status }}"
          html_body: "<h2>GOGO-AI CI/CD 报告</h2><p>状态: ${{ job.status }}</p>"
        continue-on-error: true
